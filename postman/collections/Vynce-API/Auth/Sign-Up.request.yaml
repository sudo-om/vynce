$kind: http-request
name: Sign Up
method: POST
url: '{{baseUrl}}/api/auth/signup'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "user@example.com",
      "name": "John Doe",
      "password": "password123"
    }
